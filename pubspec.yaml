name: petcare
description: "PetCare - controle de saúde de pets (Trabalho Final DDM)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de estado
  flutter_bloc: ^9.1.1

  # Comunicação com a API (Supabase REST)
  http: ^1.6.0
  # 7.3.2+ usa dbus 0.8, que conflita com o geolocator (dbus 0.7) no Linux
  connectivity_plus: ">=7.0.0 <7.3.2"

  # Banco de dados local (SQLite)
  sqflite: ^2.4.2
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0
  sqlite3: ^2.3.0
  path: ^1.9.0

  # Utilitários
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

  # Recursos nativos
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
